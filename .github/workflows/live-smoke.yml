name: Live site smoke test
on:
  push:
    paths:
      - '.github/workflows/live-smoke.yml'
      - 'src/**'
      - 'functions/**'
      - 'scripts/live-smoke.mjs'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser controller
        run: npm install --no-save --no-audit --no-fund playwright-core@1.57.0
      - name: Test live forum and capture visual
        run: node scripts/live-smoke.mjs
