<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#282828">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="YouTube">
<meta name="description" content="Watch videos and discover channels.">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./period.css">
<link rel="stylesheet" href="./period-accuracy.css">
<title>YouTube</title>
</head>
<body>
<div id="app">
<header class="site-header">
 <div class="header-inner">
  <button type="button" class="guide-toggle" data-action="toggle-guide" aria-label="Open guide"><svg class="yt-icon menu-glyph" aria-hidden="true"><use href="./icons.svg#menu"></use></svg></button>
  <button type="button" class="mobile-back" data-action="back" aria-label="Go back"><svg class="yt-icon" aria-hidden="true"><use href="./icons.svg#back"></use></svg></button>
  <button type="button" class="yt-brand" data-page="home" aria-label="YouTube home"><span class="yt-word">You</span><span class="yt-box">Tube</span></button>
  <span id="mobile-screen-title" class="mobile-screen-title" aria-hidden="true"></span>
  <form id="search-form" class="header-search"><input id="search-input" type="search" autocomplete="off" aria-label="Search" placeholder="Search"><button type="submit" aria-label="Search"><svg class="yt-icon" aria-hidden="true"><use href="./icons.svg#search"></use></svg></button></form>
  <div class="header-right"><a class="upload-link" href="https://www.youtube.com/upload" target="_blank" rel="noopener noreferrer">Upload</a><button type="button" class="account-toggle" data-action="account" aria-label="Account options"><span class="account-avatar">W</span><span class="account-label">WesleyPigeon330</span><span class="down-arrow">▾</span></button><button type="button" class="mobile-search-toggle" data-action="mobile-search" aria-label="Search"><svg class="yt-icon" aria-hidden="true"><use href="./icons.svg#search"></use></svg></button></div>
 </div>
</header>
<div id="account-menu" class="account-menu" hidden></div>
<div id="guide-backdrop" class="guide-backdrop" hidden></div>
<div class="site-body">
 <aside class="guide" id="guide" aria-label="Guide"></aside>
 <main class="content" id="main" tabindex="-1"></main>
</div>
<div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
